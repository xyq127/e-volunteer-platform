<script type="text/javascript">
    /**
     * 将后端返回的时间格式化为 yyyy-MM-dd HH:mm
     */
    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }

    /**
     * 渲染待审核活动列表
     */
    function renderActivityTable(activities) {
        var $body = $("#activity_table").empty();
        if (activities.length === 0) {
            $body.append('<tr><td colspan="7" class="text-center text-muted">暂无待审核的志愿活动</td></tr>');
            return;
        }
        $.each(activities, function (index, activity) {
            var row = "<tr>"
                + "<td>" + activity.activityName + "</td>"
                + "<td>" + (activity.activityLocation || "—") + "</td>"
                + "<td>" + formatTime(activity.activityBegintime) + "</td>"
                + "<td>" + formatTime(activity.activityEndtime) + "</td>"
                + "<td>" + formatTime(activity.activitySignddl) + "</td>"
                + "<td>" + (activity.activityNeedpeople || 0) + "</td>"
                + '<td><a class="btn btn-primary btn-xs" href="act_not_audit.html">审核</a></td>'
                + "</tr>";
            $body.append(row);
        });
    }

    $(document).ready(function () {
        $.ajax({
            url: "/admin/findAuditActivityByState",
            type: "GET",
            success: function (result) {
                var activities = (result && result.extend) ? (result.extend.auditActivity || []) : [];
                $("#count_audit").text(activities.length);
                $("#count_total").text(activities.length);
                renderActivityTable(activities);
            },
            error: function (result) {
                console.log(result);
            }
        });
    });
</script>
