<script type="text/javascript">
    /**
     * 当前页码、每页条数与检索关键字
     */
    var page = 1;
    var size = 10;
    var keyword = "";

    /**
     * 将后端返回的时间格式化为 yyyy-MM-dd HH:mm
     */
    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }

    /**
     * 渲染分页控件：共 N 条、第 X / Y 页，首页禁用上一页、末页禁用下一页
     */
    function renderPager(totalCount, currentPage, pageSize) {
        var total = totalCount || 0;
        page = currentPage || 1;
        size = pageSize || size;
        var pages = total === 0 ? 1 : Math.ceil(total / size);
        $("#pager_info").text("共 " + total + " 条");
        $("#pager_page").text("第 " + page + " / " + pages + " 页");
        $("#btn_prev_page").prop("disabled", page <= 1);
        $("#btn_next_page").prop("disabled", page >= pages);
    }

    /**
     * 渲染志愿秀列表
     */
    function renderShows(shows) {
        var $body = $("#show_table").empty();
        if (!shows || shows.length === 0) {
            $body.append('<tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>');
            return;
        }
        var html = "";
        $.each(shows, function (index, show) {
            html += `<tr>
                        <td>${show.volunteerName || "—"}</td>
                        <td>${show.activityName || "—"}</td>
                        <td>${show.showDetail || "—"}</td>
                        <td>${show.showBrowse || 0}</td>
                        <td>${show.showLike || 0}</td>
                        <td>${formatTime(show.showSharetime)}</td>
                        <td>
                            <button class="btn btn-pill btn-outline-danger btn-sm" type="button"
                                    onclick="deleteShow(${show.showNum})">删除</button>
                        </td>
                     </tr>`;
        });
        $body.html(html);
    }

    /**
     * 按当前分页与关键字查询志愿秀
     */
    function loadShows() {
        $.ajax({
            url: "/admin/review/shows",
            type: "GET",
            data: {
                "page": page,
                "size": size,
                "keyword": keyword
            },
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend) {
                    alert((result && result.msg) ? result.msg : "志愿秀加载失败");
                    return;
                }
                renderShows(result.extend.list);
                renderPager(result.extend.total, result.extend.page, result.extend.size);
            },
            error: function () {
                alert("志愿秀加载失败，请稍后重试");
            }
        });
    }

    /**
     * 删除志愿秀，确认后调用删除接口
     */
    function deleteShow(showNum) {
        if (!confirm("确定删除该条志愿秀吗？删除后门户不再展示。")) {
            return;
        }
        $.ajax({
            url: "/admin/review/show/delete",
            type: "POST",
            data: {
                "showNum": showNum
            },
            success: function (result) {
                alert((result && result.msg) ? result.msg : "志愿秀删除已完成");
                if (result && result.code === 100) {
                    loadShows();
                }
            },
            error: function () {
                alert("志愿秀删除失败，请稍后重试");
            }
        });
    }

    /**
     * 点击查询：关键字检索从第一页开始
     */
    $("#btn_search_show").click(function () {
        keyword = $.trim($("#show_keyword").val());
        page = 1;
        loadShows();
    });

    /**
     * 点击重置：清空关键字并回到第一页
     */
    $("#btn_reset_show").click(function () {
        $("#show_keyword").val("");
        keyword = "";
        page = 1;
        loadShows();
    });

    /**
     * 回车即查询
     */
    $("#show_keyword").keydown(function (event) {
        if (event.keyCode === 13) {
            $("#btn_search_show").click();
        }
    });

    /**
     * 分页按钮
     */
    $("#btn_prev_page").click(function () {
        if (page > 1) {
            page = page - 1;
            loadShows();
        }
    });

    $("#btn_next_page").click(function () {
        page = page + 1;
        loadShows();
    });

    /**
     * 进入页面即加载志愿秀列表
     */
    $(document).ready(function () {
        loadShows();
    });
</script>
