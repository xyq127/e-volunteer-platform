<script type="text/javascript">
    /**
     * 当前页码、每页条数、操作类型与操作账号检索条件
     */
    var page = 1;
    var size = 10;
    var action = "";
    var operator = "";

    /**
     * 操作类型编码与中文名称的对应关系，数据来自后端操作类型下拉选项
     */
    var actionNames = {};

    /**
     * 是否已经载入过操作类型下拉选项，避免每次查询重复渲染
     */
    var actionOptionsLoaded = false;

    /**
     * 将后端返回的时间格式化为 yyyy-MM-dd HH:mm
     */
    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }

    /**
     * 操作角色文案
     */
    function roleText(role) {
        if (role === "ROLE_ADMIN") {
            return "平台管理员";
        }
        if (role === "ROLE_ORGANIZATION") {
            return "志愿者组织";
        }
        if (role === "ROLE_VOLUNTEER") {
            return "志愿者";
        }
        return role || "—";
    }

    /**
     * 操作类型文案：优先使用后端返回的中文名称，未匹配时展示编码本身
     */
    function actionText(code) {
        if (!code) {
            return "—";
        }
        return actionNames[code] || code;
    }

    /**
     * 渲染操作类型下拉选项，选项数据来自接口返回的 actions
     */
    function renderActionOptions(actions) {
        if (actionOptionsLoaded || !actions) {
            return;
        }
        var html = "";
        $.each(actions, function (index, item) {
            actionNames[item.code] = item.name;
            html += `<option value="${item.code}">${item.name}</option>`;
        });
        $("#audit_action").append(html);
        actionOptionsLoaded = true;
        $("#audit_action").val(action);
    }

    /**
     * 渲染分页控件：共 N 条、第 X / Y 页，首页禁用上一页、末页禁用下一页
     */
    function renderPager(totalCount, currentPage, pageSize) {
        var total = totalCount || 0;
        page = currentPage || 1;
        size = pageSize || size;
        var pages = total === 0 ? 1 : Math.ceil(total / size);
        $("#pager_info").text("共 " + total + " 条");
        $("#pager_page").text("第 " + page + " / " + pages + " 页");
        $("#btn_prev_page").prop("disabled", page <= 1);
        $("#btn_next_page").prop("disabled", page >= pages);
    }

    /**
     * 渲染审计日志列表
     */
    function renderAuditLogs(logs) {
        var $body = $("#audit_table").empty();
        if (!logs || logs.length === 0) {
            $body.append('<tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>');
            return;
        }
        var html = "";
        $.each(logs, function (index, log) {
            html += `<tr>
                        <td>${formatTime(log.auditTime)}</td>
                        <td>${log.auditOperator || "—"}</td>
                        <td>${roleText(log.auditRole)}</td>
                        <td>${actionText(log.auditAction)}</td>
                        <td>${log.auditTarget || "—"}</td>
                        <td>${log.auditDetail || "—"}</td>
                        <td>${log.auditIp || "—"}</td>
                     </tr>`;
        });
        $body.html(html);
    }

    /**
     * 按当前分页、操作类型与操作账号查询审计日志
     */
    function loadAuditLogs() {
        $.ajax({
            url: "/admin/audit/list",
            type: "GET",
            data: {
                "page": page,
                "size": size,
                "action": action,
                "operator": operator
            },
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend) {
                    alert((result && result.msg) ? result.msg : "审计日志加载失败");
                    return;
                }
                renderActionOptions(result.extend.actions);
                renderAuditLogs(result.extend.list);
                renderPager(result.extend.total, result.extend.page, result.extend.size);
            },
            error: function () {
                alert("审计日志加载失败，请稍后重试");
            }
        });
    }

    /**
     * 点击查询：按操作类型与操作账号从第一页开始检索
     */
    $("#btn_search_audit").click(function () {
        action = $("#audit_action").val();
        operator = $.trim($("#audit_operator").val());
        page = 1;
        loadAuditLogs();
    });

    /**
     * 切换操作类型即重新检索
     */
    $("#audit_action").change(function () {
        $("#btn_search_audit").click();
    });

    /**
     * 点击重置：清空检索条件
     */
    $("#btn_reset_audit").click(function () {
        $("#audit_action").val("");
        $("#audit_operator").val("");
        action = "";
        operator = "";
        page = 1;
        loadAuditLogs();
    });

    /**
     * 回车即查询
     */
    $("#audit_operator").keydown(function (event) {
        if (event.keyCode === 13) {
            $("#btn_search_audit").click();
        }
    });

    /**
     * 分页按钮
     */
    $("#btn_prev_page").click(function () {
        if (page > 1) {
            page = page - 1;
            loadAuditLogs();
        }
    });

    $("#btn_next_page").click(function () {
        page = page + 1;
        loadAuditLogs();
    });

    /**
     * 进入页面即加载审计日志
     */
    $(document).ready(function () {
        loadAuditLogs();
    });
</script>
