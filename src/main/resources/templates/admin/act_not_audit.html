<script type="text/javascript">
    /**
     * 将后端返回的时间格式化为 yyyy-MM-dd HH:mm
     */
    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }
</script>

<script type="text/javascript">
    function build_activity_table(result) {
        //清空table表格
        $("#auditActivity_table thead").empty();
        $("#auditActivity_table tbody").empty();

        var auditActivity = result.extend.auditActivity;

        var activityNameTd = $("<td></td>").addClass("text-center").append("活动名称");
        var activityBegintimeTd = $("<td></td>").addClass("text-center").append("活动开始时间");
        var activityEndtimeTd = $("<td></td>").addClass("text-center").append("活动结束时间");
        var activityLocationTd = $("<td></td>").addClass("text-center").append("活动地点");
        var activityNeedpeopleTd = $("<td></td>").addClass("text-center").append("需求人数");
        var controlTd = $("<td></td>").addClass("text-center").append("操作");
        $("<tr></tr>").append(activityNameTd)
            .append(activityBegintimeTd)
            .append(activityEndtimeTd)
            .append(activityLocationTd)
            .append(activityNeedpeopleTd)
            .append(controlTd)
            .addClass("active")
            .appendTo("#auditActivity_table thead");
        var tabValue = ``;
        $.each(auditActivity, function (index, item) {
            tabValue += `<tr>
                            <td class="text-center">${item.activityName}</td>
                            <td class="text-center">${formatTime(item.activityBegintime)}</td>
                            <td class="text-center">${formatTime(item.activityEndtime)}</td>
                            <td class="text-center">${item.activityLocation}</td>
                            <td class="text-center">${item.activityNeedpeople}</td>
                            <td class="text-center">
                            <button class="btn btn-pill btn-outline-primary btn-sm" type="button" onclick="activityInfo(${item.activityNum})" data-bs-toggle="modal" data-bs-target="#myModal" data-bs-original-title title>查看详情</button>
                            </td>
                          </tr>
                `;
            $("#auditActivity_table tbody").html(tabValue);
        });
    }

    //查看活动详情
    function activityInfo(activityNum) {
        console.log("查看活动详情");
        $.ajax({
            url: "/activity/activityInfo",
            type: "GET",
            data: {
                "activityNum": activityNum,
            },
            success: function (result) {
                console.log(result);
                $("#activityInformation").empty();
                var modalValue = ``;
                modalValue = `<div class="form-group row">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label text-end" >活动名称</label>
                                    <div class="col-sm-9">
                                        <div class="input-group">
                                            <input class="form-control" id="actvity_name" type="text" disabled="disabled">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label text-end">活动内容</label>
                                    <div class="col-sm-9">
                                        <div class="input-group">
                                            <textarea class="form-control" id="actvity_detail" type="text" disabled="disabled"></textarea>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label text-end">活动开始时间</label>
                                    <div class="col-sm-9">
                                        <div class="input-group">
                                            <input class="datepicker-here form-control digits" type="text" data-language="en"
                                                id="actvity_begintime" disabled="disabled">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label text-end">活动结束时间</label>
                                    <div class="col-sm-9">
                                        <div class="input-group">
                                            <input class="datepicker-here form-control digits" type="text" data-language="en"
                                                   id="actvity_endtime" disabled="disabled">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label text-end">活动地点</label>
                                    <div class="col-sm-9">
                                        <div class="input-group">
                                            <input class="form-control" id="actvity_location" type="text" disabled="disabled">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label text-end">需求人数</label>
                                    <div class="col-sm-9">
                                        <div class="input-group">
                                            <input class="form-control" id="actvity_needpeople" type="text" disabled="disabled">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label text-end">注意事项</label>
                                    <div class="col-sm-9">
                                        <div class="input-group">
                                            <input class="form-control" id="actvity_notice" type="text" disabled="disabled">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label text-end">报名截止时间</label>
                                    <div class="col-sm-9">
                                        <div class="input-group">
                                            <input class="datepicker-here form-control digits" type="text" data-language="en"
                                                      id="actvity_signddl" disabled="disabled">
                                        </div>
                                    </div>
                                </div>
                            </div>
                `;
                $("#activityInformation").html(modalValue);
                let actInfo = result.extend.activityInfo[0];
                $("#actvity_name").val(actInfo.activityName);
                $("#actvity_detail").val(actInfo.activityDetail);
                $("#actvity_begintime").val(actInfo.activityBegintime);
                $("#actvity_endtime").val(actInfo.activityEndtime);
                $("#actvity_location").val(actInfo.activityLocation);
                $("#actvity_needpeople").val(actInfo.activityNeedpeople);
                $("#actvity_notice").val(actInfo.activityNotice);
                $("#actvity_signddl").val(actInfo.activitySignddl);
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    //删除该待审核的活动
    function auditActivityDelete(activityNum) {
        console.log("删除");
        $.ajax({
            url: "/activity/auditActivityDelete",
            type: "POST",
            data: {
                "activityNum": activityNum,
            },
            success: function (result) {
                if (result) {
                    console.log(result);
                    alert("修改成功");
                    build_activity_table(result);
                } else {
                    alert("修改失败");
                }
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    $("#btn_pass").click(function () {
        var actName = $("#actvity_name").val();
        $.ajax({

            },

                window.location.href = "act_not_audit.html";
                console.log(result);
            }
        });

    });

    $("#btn_not_pass").click(function () {
        var actName = $("#actvity_name").val();
        $.ajax({
            url: "/admin/passAct",
            type: "POST",
            data: {
                "actName": actName,
                "statue":4
            },
            success: function (result) {
                alert(result);
                window.location.href = "act_not_audit.html";
                console.log(result);
            }
        });

    });

    //一进网页就加载freshPage()
    $(document).ready(function () {
        $.ajax({
            url: "/admin/findAuditActivityByState",
            type: "GET",
            data: {},
            success: function (result) {
                console.log(result);
                build_activity_table(result);
            },
            error: function (result) {
                console.log(result);
            }
        });
    });

</script>
