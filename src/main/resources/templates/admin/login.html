<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="console/assets/images/favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="console/assets/images/favicon.png" type="image/x-icon">
    <title>登录 - E志愿志愿者服务平台 V1.0</title>
    <!-- Font Awesome-->
    <link rel="stylesheet" type="text/css" href="/console/assets/css/fontawesome.css">
    <!-- ico-font-->
    <link rel="stylesheet" type="text/css" href="/console/assets/css/icofont.css">
    <!-- Themify icon-->
    <link rel="stylesheet" type="text/css" href="/console/assets/css/themify.css">
    <!-- Flag icon-->
    <link rel="stylesheet" type="text/css" href="/console/assets/css/flag-icon.css">
    <!-- Feather icon-->
    <link rel="stylesheet" type="text/css" href="/console/assets/css/feather-icon.css">
    <!-- Plugins css start-->
    <!-- Plugins css Ends-->
    <!-- Bootstrap css-->
    <link rel="stylesheet" type="text/css" href="/console/assets/css/bootstrap.css">
    <!-- App css-->
    <link rel="stylesheet" type="text/css" href="/console/assets/css/style.css">
    <!-- Responsive css-->
    <link rel="stylesheet" type="text/css" href="/console/assets/css/responsive.css">
  </head>
  <body>
    <!-- Loader starts-->
    <div class="loader-wrapper">
      <div class="theme-loader">    
        <div class="loader-p"></div>
      </div>
    </div>
    <!-- Loader ends-->
    <!-- page-wrapper Start-->
    <section>         
      <div class="container-fluid p-0">
        <div class="row">
          <div class="col-12">
            <div class="login-card">
              <form class="theme-form login-form" action="/login" method="post">
                <h3>登录</h3>
                <h4>欢迎回到E志愿</h4>
                <div class="form-group">
                  <label>账号</label>
                  <div class="input-group"><span class="input-group-text"><i class="icon-email"></i></span>
                    <input class="form-control" required="" placeholder="username" name="username">
                  </div>
                </div>
                <div class="form-group">
                  <label>密码</label>
                  <div class="input-group"><span class="input-group-text"><i class="icon-lock"></i></span>
                    <input class="form-control" type="password" name="password" required="" placeholder="*********">
                    <div class="show-hide"><span class="show">                         </span></div>
                  </div>
                </div>

                <div class="form-group">
                  <label>身份</label>
                  <div class="radio"  style="display:flex;justify-content: space-around">
                    <input id="status1" type="radio" name="status" value="volunteer">
                    <label for="status1">志愿者</label>&ensp;&ensp;
                    <input id="status2" type="radio" name="status" value="organization">
                    <label for="status2">志愿者组织</label>&ensp;&ensp;
                    <input id="status3" type="radio" name="status" value="admin">
                    <label for="status3">管理部门</label>
                  </div>
                </div>

                <div class="form-group">
                  <div class="checkbox">
                    <input id="checkbox1" type="checkbox">
                    <label for="checkbox1">记住密码</label>
                  </div>
                  
                </div>
                <div class="form-group">
                  <button class="btn btn-primary btn-block" type="submit">登录</button>
                </div>
                <div class="login-social-title">                
                  <h5>Sign In With</h5>
                </div>
                <div class="form-group">
                  <ul class="login-social">
                    <li><a href="https://www.linkedin.com/login" target="_blank"><i data-feather="linkedin"></i></a></li>
                    <li><a href="https://www.linkedin.com/login" target="_blank"><i data-feather="twitter"></i></a></li>
                    <li><a href="https://www.linkedin.com/login" target="_blank"><i data-feather="facebook"></i></a></li>
                    <li><a href="https://www.instagram.com/login" target="_blank"><i data-feather="instagram">                  </i></a></li>
                  </ul>
                </div>
                <p>没有账号？<a class="ms-2" href="sign-up.html">注册账号</a></p>
                <p class="f-12 text-muted">平台管理员 admin_001、志愿者组织 org_001、志愿者 vol_00001，初始密码均为 123456</p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- page-wrapper end-->
    <!-- latest jquery-->
<script src="/console/assets/js/jquery-3.5.1.min.js"></script>
<!-- feather icon js-->
<script src="/console/assets/js/icons/feather-icon/feather.min.js"></script>
<script src="/console/assets/js/icons/feather-icon/feather-icon.js"></script>
<script src="/console/assets/js/config.js"></script>
<!-- Bootstrap js-->
<script src="/console/assets/js/bootstrap/popper.min.js"></script>
<script src="/console/assets/js/bootstrap/bootstrap.min.js"></script>
<!-- Theme js-->
<script src="/console/assets/js/script.js"></script>
    <!-- login js-->
    <!-- Plugin used-->
  </body>
</html>
