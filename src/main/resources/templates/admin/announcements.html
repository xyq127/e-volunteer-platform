<!-- latest jquery-->
<script src="/console/assets/js/jquery-3.5.1.min.js"></script>
<!-- feather icon js-->
<script src="/console/assets/js/icons/feather-icon/feather.min.js"></script>
<script src="/console/assets/js/icons/feather-icon/feather-icon.js"></script>
<!-- Sidebar jquery-->
<script src="/console/assets/js/sidebar-menu.js"></script>
<script src="/console/assets/js/config.js"></script>
<!-- Bootstrap js-->
<script src="/console/assets/js/bootstrap/popper.min.js"></script>
<script src="/console/assets/js/bootstrap/bootstrap.min.js"></script>
<!-- Theme js-->
<script src="/console/assets/js/script.js"></script>

<script type="text/javascript">
    /**
     * 当前页码、每页条数与检索关键字
     */
    var page = 1;
    var size = 10;
    var keyword = "";

    /**
     * 当前页公告数据，供编辑与删除时取回公告标题和内容
     */
    var announcements = [];

    /**
     * 当前正在管理附件的公告编号
     */
    var currentAnnouncementNum = null;

    /**
     * 公告附件管理模态框实例
     */
    var fileModal = null;

    /**
     * 渲染分页控件：共 N 条、第 X / Y 页，首页禁用上一页、末页禁用下一页
     */
    function renderPager(totalCount, currentPage, pageSize) {
        var total = totalCount || 0;
        page = currentPage || 1;
        size = pageSize || size;
        var pages = total === 0 ? 1 : Math.ceil(total / size);
        $("#pager_info").text("共 " + total + " 条");
        $("#pager_page").text("第 " + page + " / " + pages + " 页");
        $("#btn_prev_page").prop("disabled", page <= 1);
        $("#btn_next_page").prop("disabled", page >= pages);
    }

    /**
     * 渲染通知公告列表
     */
    function renderAnnouncements(list) {
        announcements = list || [];
        var $body = $("#ann_table").empty();
        if (announcements.length === 0) {
            $body.append('<tr><td colspan="4" class="text-center text-muted">暂无数据</td></tr>');
            return;
        }
        var html = "";
        $.each(announcements, function (index, announcement) {
            html += `<tr>
                        <td>${announcement.policyannouncementName || "—"}</td>
                        <td>${announcement.policyannouncementDetail || "—"}</td>
                        <td>${announcement.fileCount || 0}</td>
                        <td>
                            <button class="btn btn-pill btn-outline-primary btn-sm" type="button"
                                    onclick="editAnnouncement(${announcement.policyannouncementNum})">编辑</button>
                            <button class="btn btn-pill btn-outline-success btn-sm" type="button"
                                    onclick="openFiles(${announcement.policyannouncementNum})">附件管理</button>
                            <button class="btn btn-pill btn-outline-danger btn-sm" type="button"
                                    onclick="deleteAnnouncement(${announcement.policyannouncementNum})">删除</button>
                        </td>
                     </tr>`;
        });
        $body.html(html);
    }

    /**
     * 按当前分页与关键字查询通知公告
     */
    function loadAnnouncements() {
        $.ajax({
            url: "/admin/announcement/list",
            type: "GET",
            data: {
                "page": page,
                "size": size,
                "keyword": keyword
            },
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend) {
                    alert((result && result.msg) ? result.msg : "通知公告加载失败");
                    return;
                }
                renderAnnouncements(result.extend.list);
                renderPager(result.extend.total, result.extend.page, result.extend.size);
            },
            error: function () {
                alert("通知公告加载失败，请稍后重试");
            }
        });
    }

    /**
     * 保存通知公告：公告编号为空时新增，不为空时更新
     */
    $("#btn_save_ann").click(function () {
        var name = $.trim($("#ann_name").val());
        var detail = $.trim($("#ann_detail").val());
        if (!name) {
            alert("请填写公告标题");
            return;
        }
        if (!detail) {
            alert("请填写公告内容");
            return;
        }
        var num = $("#ann_num").val();
        $.ajax({
            url: "/admin/announcement/save",
            type: "POST",
            data: {
                "policyannouncementNum": num,
                "name": name,
                "detail": detail
            },
            success: function (result) {
                alert((result && result.msg) ? result.msg : "公告保存已完成");
                if (result && result.code === 100) {
                    clearAnnouncementForm();
                    loadAnnouncements();
                }
            },
            error: function () {
                alert("公告保存失败，请稍后重试");
            }
        });
    });

    /**
     * 清空公告表单，回到新增状态
     */
    function clearAnnouncementForm() {
        $("#ann_num").val("");
        $("#ann_name").val("");
        $("#ann_detail").val("");
    }

    /**
     * 载入公告内容进行编辑
     */
    function editAnnouncement(num) {
        var target = null;
        $.each(announcements, function (index, announcement) {
            if (announcement.policyannouncementNum === num) {
                target = announcement;
            }
        });
        if (!target) {
            alert("未找到该公告，请刷新列表后重试");
            return;
        }
        $("#ann_num").val(target.policyannouncementNum);
        $("#ann_name").val(target.policyannouncementName);
        $("#ann_detail").val(target.policyannouncementDetail);
        window.scrollTo(0, 0);
    }

    /**
     * 删除通知公告，公告下的附件一并删除
     */
    function deleteAnnouncement(num) {
        if (!confirm("确定删除该通知公告吗？公告下的附件也会一并删除。")) {
            return;
        }
        $.ajax({
            url: "/admin/announcement/delete",
            type: "POST",
            data: {
                "policyannouncementNum": num
            },
            success: function (result) {
                alert((result && result.msg) ? result.msg : "公告删除已完成");
                if (result && result.code === 100) {
                    if (currentAnnouncementNum === num) {
                        currentAnnouncementNum = null;
                        if (fileModal) {
                            fileModal.hide();
                        }
                    }
                    loadAnnouncements();
                }
            },
            error: function () {
                alert("公告删除失败，请稍后重试");
            }
        });
    }

    /**
     * 打开公告附件管理弹窗并加载附件列表
     */
    function openFiles(num) {
        currentAnnouncementNum = num;
        $("#file_announcement_info").text("公告编号：" + num + "，附件下载对门户访客开放");
        $("#file_input").val("");
        $("#file_table").html('<tr><td colspan="2" class="text-center text-muted">数据加载中……</td></tr>');
        if (!fileModal) {
            fileModal = new bootstrap.Modal(document.getElementById("fileModal"));
        }
        fileModal.show();
        loadFiles();
    }

    /**
     * 查询当前公告的附件列表
     */
    function loadFiles() {
        if (currentAnnouncementNum === null) {
            return;
        }
        $.ajax({
            url: "/admin/announcement/files",
            type: "GET",
            data: {
                "policyannouncementNum": currentAnnouncementNum
            },
            success: function (result) {
                var files = (result && result.extend && result.extend.files) ? result.extend.files : [];
                renderFiles(files);
            },
            error: function () {
                alert("附件列表加载失败，请稍后重试");
            }
        });
    }

    /**
     * 渲染公告附件列表，下载地址使用后端返回的文件访问路径
     */
    function renderFiles(files) {
        var $body = $("#file_table").empty();
        if (!files || files.length === 0) {
            $body.append('<tr><td colspan="2" class="text-center text-muted">暂无数据</td></tr>');
            return;
        }
        var html = "";
        $.each(files, function (index, file) {
            html += `<tr>
                        <td><a href="${file.policyfileRoute}" target="_blank">${file.policyfileName || "附件"}</a></td>
                        <td>
                            <button class="btn btn-pill btn-outline-danger btn-sm" type="button"
                                    onclick="deleteFile(${file.policyfileNum})">删除</button>
                        </td>
                     </tr>`;
        });
        $body.html(html);
    }

    /**
     * 上传公告附件
     */
    $("#btn_upload_file").click(function () {
        if (currentAnnouncementNum === null) {
            alert("请先保存公告后再上传附件");
            return;
        }
        var input = document.getElementById("file_input");
        if (!input.files || input.files.length === 0) {
            alert("请选择需要上传的附件");
            return;
        }
        var formData = new FormData();
        formData.append("policyannouncementNum", currentAnnouncementNum);
        formData.append("file", input.files[0]);
        $.ajax({
            url: "/admin/announcement/file",
            type: "POST",
            data: formData,
            processData: false,
            contentType: false,
            success: function (result) {
                alert((result && result.msg) ? result.msg : "附件上传已完成");
                if (result && result.code === 100) {
                    $("#file_input").val("");
                    loadFiles();
                    loadAnnouncements();
                }
            },
            error: function () {
                alert("附件上传失败，请稍后重试");
            }
        });
    });

    /**
     * 删除公告附件
     */
    function deleteFile(policyfileNum) {
        if (!confirm("确定删除该公告附件吗？")) {
            return;
        }
        $.ajax({
            url: "/admin/announcement/file/delete",
            type: "POST",
            data: {
                "policyfileNum": policyfileNum
            },
            success: function (result) {
                alert((result && result.msg) ? result.msg : "附件删除已完成");
                if (result && result.code === 100) {
                    loadFiles();
                    loadAnnouncements();
                }
            },
            error: function () {
                alert("附件删除失败，请稍后重试");
            }
        });
    }

    /**
     * 清空公告表单按钮
     */
    $("#btn_cancel_edit").click(function () {
        clearAnnouncementForm();
    });

    /**
     * 点击查询：关键字检索从第一页开始
     */
    $("#btn_search_ann").click(function () {
        keyword = $.trim($("#ann_keyword").val());
        page = 1;
        loadAnnouncements();
    });

    /**
     * 点击重置：清空关键字并回到第一页
     */
    $("#btn_reset_ann").click(function () {
        $("#ann_keyword").val("");
        keyword = "";
        page = 1;
        loadAnnouncements();
    });

    /**
     * 回车即查询
     */
    $("#ann_keyword").keydown(function (event) {
        if (event.keyCode === 13) {
            $("#btn_search_ann").click();
        }
    });

    /**
     * 分页按钮
     */
    $("#btn_prev_page").click(function () {
        if (page > 1) {
            page = page - 1;
            loadAnnouncements();
        }
    });

    $("#btn_next_page").click(function () {
        page = page + 1;
        loadAnnouncements();
    });

    /**
     * 进入页面即加载通知公告列表
     */
    $(document).ready(function () {
        loadAnnouncements();
    });
</script>
