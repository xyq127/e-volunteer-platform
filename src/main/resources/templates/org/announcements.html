<script type="text/javascript">

    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }

    function toDateTimeInput(value) {
        if (!value) {
            return "";
        }
        return String(value).replace(" ", "T").substring(0, 16);
    }

    function toApiTime(value) {
        if (!value) {
            return "";
        }
        return String(value).replace("T", " ");
    }

    function renderPager(holderId, total, page, size, onChange) {
        total = Number(total) || 0;
        page = Number(page) || 1;
        size = Number(size) || 10;
        var totalPage = Math.ceil(total / size);
        var currentPage = totalPage === 0 ? 0 : page;
        var html = '<div class="d-flex justify-content-between align-items-center flex-wrap">'
            + '<span class="text-muted">共 ' + total + ' 条，第 ' + currentPage + ' / ' + totalPage + ' 页</span>'
            + '<div class="btn-group btn-group-pill" role="group" aria-label="分页">'
            + '<button class="btn btn-outline-primary btn-sm pager-prev" type="button"'
            + (page <= 1 ? ' disabled' : '') + '>上一页</button>'
            + '<button class="btn btn-outline-primary btn-sm pager-next" type="button"'
            + (page >= totalPage ? ' disabled' : '') + '>下一页</button>'
            + '</div></div>';
        var $holder = $("#" + holderId);
        $holder.html(html);
        $holder.find(".pager-prev").on("click", function () {
            if (page > 1) {
                onChange(page - 1);
            }
        });
        $holder.find(".pager-next").on("click", function () {
            if (page < totalPage) {
                onChange(page + 1);
            }
        });
    }

    function pageData(result, fallbackPage, fallbackSize) {
        var extend = (result && result.extend) ? result.extend : {};
        var total = Number(extend.total);
        var currentPage = Number(extend.page);
        var pageSize = Number(extend.size);
        return {
            list: extend.list || [],
            total: (isNaN(total) || total < 0) ? 0 : total,
            page: (isNaN(currentPage) || currentPage < 1) ? fallbackPage : currentPage,
            size: (isNaN(pageSize) || pageSize < 1) ? fallbackSize : pageSize
        };
    }

    function tip(result, fallback) {
        if (result && result.msg) {
            return result.msg;
        }
        if (typeof result === "string" && result) {
            return result;
        }
        return fallback;
    }

    function loadUnreadCount() {
        $.ajax({
            url: "/org/notifications/unreadCount",
            type: "GET",
            success: function (result) {
                var count = (result && result.extend) ? result.extend.count : 0;
                $("#unread_count").text((count === null || count === undefined) ? 0 : count);
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    var page = 1, size = 10, activityNum = "";

    var announcements = {};

    var announcementModal = null;

    function loadActivityOptions(selector) {
        var urls = [
            "/activity/findNotStartActivityByNumAndState",
            "/activity/findCarryActivityByNumAndState",
            "/activity/findEndActivityByNumAndState"
        ];
        $.each(urls, function (index, url) {
            $.ajax({
                url: url,
                type: "GET",
                data: {"page": 1, "size": 100},
                success: function (result) {
                    var data = pageData(result, 1, 100);
                    var $select = $(selector);
                    $.each(data.list, function (i, activity) {
                        if ($select.find('option[value="' + activity.activityNum + '"]').length === 0) {
                            $select.append($("<option></option>").val(activity.activityNum)
                                .text(activity.activityName));
                        }
                    });
                },
                error: function (result) {
                    console.log(result);
                }
            });
        });
    }

    function loadAnnouncements() {
        $.ajax({
            url: "/org/content/announcements",
            type: "GET",
            data: {"activityNum": activityNum, "page": page, "size": size},
            success: function (result) {
                var data = pageData(result, page, size);
                var tabValue = "";
                $.each(data.list, function (index, item) {
                    announcements[item.actannouncementNum] = item;
                    tabValue += `<tr>
                                    <td>${item.actannouncementName}</td>
                                    <td>${item.actannouncementDetail || "—"}</td>
                                    <td>${item.activityName || "—"}</td>
                                    <td>
                                        <div class="btn-group btn-group-pill" role="group" aria-label="公告操作">
                                            <button class="btn btn-outline-secondary btn-sm" type="button"
                                                    onclick="openAnnouncementModal(${item.actannouncementNum})">编辑</button>
                                            <button class="btn btn-outline-danger btn-sm" type="button"
                                                    onclick="deleteAnnouncement(${item.actannouncementNum})">删除</button>
                                        </div>
                                    </td>
                                 </tr>`;
                });
                if (data.list.length === 0) {
                    tabValue = `<tr><td colspan="4" class="text-center text-muted">暂无数据</td></tr>`;
                }
                $("#announcement_table tbody").html(tabValue);
                renderPager("announcement_pager", data.total, data.page, data.size, function (target) {
                    page = target;
                    loadAnnouncements();
                });
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function openAnnouncementModal(announcementNum) {
        var announcement = announcementNum ? announcements[announcementNum] : null;
        $("#announcement_num").val(announcement ? announcement.actannouncementNum : "");
        $("#announcementModalLabel").text(announcement ? "编辑活动公告" : "新增活动公告");
        $("#announcement_name").val(announcement ? announcement.actannouncementName : "");
        $("#announcement_detail").val(announcement ? (announcement.actannouncementDetail || "") : "");
        if (announcement && $("#announcement_activity").find('option[value="' + announcement.activityNum + '"]').length === 0) {
            $("#announcement_activity").append($("<option></option>").val(announcement.activityNum)
                .text(announcement.activityName || ("活动 " + announcement.activityNum)));
        }
        $("#announcement_activity").val(announcement ? announcement.activityNum : ($("#activity_filter").val() || ""));
        if (!announcementModal) {
            announcementModal = new bootstrap.Modal(document.getElementById("announcementModal"));
        }
        announcementModal.show();
    }

    function saveAnnouncement() {
        var activityValue = $("#announcement_activity").val();
        var name = $.trim($("#announcement_name").val());
        var detail = $.trim($("#announcement_detail").val());
        if (!activityValue) {
            alert("请选择公告所属活动");
            return;
        }
        if (!name) {
            alert("请填写公告标题");
            return;
        }
        if (!detail) {
            alert("请填写公告内容");
            return;
        }
        $.ajax({
            url: "/org/content/announcement/save",
            type: "POST",
            data: {
                "announcementNum": $("#announcement_num").val(),
                "activityNum": activityValue,
                "name": name,
                "detail": detail
            },
            success: function (result) {
                var success = result && result.code === 100;
                alert(tip(result, success ? "活动公告已保存" : "活动公告保存失败"));
                if (success) {
                    if (announcementModal) {
                        announcementModal.hide();
                    }
                    loadAnnouncements();
                }
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function deleteAnnouncement(announcementNum) {
        if (!confirm("确定删除该活动公告吗？删除后不可恢复。")) {
            return;
        }
        $.ajax({
            url: "/org/content/announcement/delete",
            type: "POST",
            data: {"announcementNum": announcementNum},
            success: function (result) {
                var success = result && result.code === 100;
                alert(tip(result, success ? "活动公告已删除" : "活动公告删除失败"));
                if (success) {
                    loadAnnouncements();
                }
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    $(document).ready(function () {
        loadUnreadCount();
        loadActivityOptions("#activity_filter");
        loadActivityOptions("#announcement_activity");
        loadAnnouncements();
        $("#search_button").click(function () {
            page = 1;
            activityNum = $("#activity_filter").val();
            loadAnnouncements();
        });
        $("#add_announcement_button").click(function () {
            openAnnouncementModal(null);
        });
        $("#announcement_submit").click(function () {
            saveAnnouncement();
        });
    });

</script>
