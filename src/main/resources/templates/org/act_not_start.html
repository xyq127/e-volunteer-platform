<script type="text/javascript">
    /**
     * 将后端返回的时间格式化为 yyyy-MM-dd HH:mm
     */
    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }
</script>

<script type="text/javascript">

    function parseDate(str) {
        if (str.match(/^\d{4}[\-\/\s+]\d{1,2}[\-\/\s+]\d{1,2}$/)) {
            return new Date(str.replace(/[\-\/\s+]/i, '/'));
        } else if (str.match(/^\d{8}$/)) {
            return new Date(str.substring(0, 4) + '/' + str.substring(4, 6) + '/' + str.substring(6));
        } else {
            return ('转换发生错误')
        }
    }

    function build_activity_table(result) {
        //清空table表格
        $("#notStartActivity_table thead").empty();
        $("#notStartActivity_table tbody").empty();

        var notStartActivity = result.extend.auditActivity;

        var activityNameTd = $("<td></td>").addClass("text-center").append("活动名称");
        var activityBegintimeTd = $("<td></td>").addClass("text-center").append("活动开始时间");
        var activityEndtimeTd = $("<td></td>").addClass("text-center").append("活动结束时间");
        var activityLocationTd = $("<td></td>").addClass("text-center").append("活动地点");
        var activityNeedpeopleTd = $("<td></td>").addClass("text-center").append("需求人数");
        var controlTd = $("<td></td>").addClass("text-center").append("操作");
        $("<tr></tr>").append(activityNameTd)
            .append(activityBegintimeTd)
            .append(activityEndtimeTd)
            .append(activityLocationTd)
            .append(activityNeedpeopleTd)
            .append(controlTd)
            .addClass("active")
            .appendTo("#notStartActivity_table thead");
        var tabValue = ``;
        $.each(notStartActivity, function (index, item) {
            tabValue += `<tr>
                            <td class="text-center">${item.activityName}</td>
                            <td class="text-center">${formatTime(item.activityBegintime)}</td>
                            <td class="text-center">${formatTime(item.activityEndtime)}</td>
                            <td class="text-center">${item.activityLocation}</td>
                            <td class="text-center">${item.activityNeedpeople}</td>
                            <td class="text-center">
                                <div class="btn-group btn-group-pill" role="group" aria-label="Basic example">
                                    <button class="btn btn-outline-secondary" type="button" onclick="volRecruit(${item.activityNum})" data-bs-toggle="modal" data-bs-target=".bd-example-modal-lg">志愿者招募</button>
                            </div>
                            </td>
                          </tr>
                `;
        });
        if (notStartActivity.length === 0) {
            tabValue = `<tr><td colspan="6" class="text-center text-muted">暂无数据</td></tr>`;
        }
        $("#notStartActivity_table tbody").html(tabValue);
    }

    function volRecruit(activityNum) {
        console.log("志愿者招募/报名人列表");
        $.ajax({
            url: "/activity/volRecruit",
            type: "GET",
            data: {
                "activityNum": activityNum,
            },
            success: function (result) {
                console.log(result);
                $("#volRecruitList_table thead").empty();
                $("#volRecruitList_table tbody").empty();
                var modalValueThead = ``;
                modalValueThead = `<tr>
                                <td class="text-center">编号</td>
                                <td class="text-center">姓名</td>
                                <td class="text-center">报名时间</td>
                                <td class="text-center">性别</td>
                                <td class="text-center">联系电话</td>
                                <td class="text-center">匹配度</td>
                                <td class="text-center">操作</td>
                              </tr>
                `;
                $("#volRecruitList_table thead").html(modalValueThead);

                var recruitVolList = (result && result.extend) ? (result.extend.volunteerList || []) : [];
                var modalValueTbody = ``;
                $.each(recruitVolList, function (index, item) {
                    // 志愿者表中的性别直接保存中文，无值时以占位符展示
                    var gender = item.volunteer.volunteerGender || '—';
                    modalValueTbody += `<tr>
                                            <td class="text-center">${item.volunteer.volunteerId}</td>
                                            <td class="text-center">${item.volunteer.volunteerName}</td>
                                            <td class="text-center">${formatTime(item.participateApplytime)}</td>
                                            <td class="text-center">${gender}</td>
                                            <td class="text-center">${item.volunteer.volunteerTel}</td>
                                            <td class="text-center">${(item.matchScore === null || item.matchScore === undefined) ? "—" : item.matchScore + " 分"}
                                                <div class="text-muted small">${item.matchReasons || "—"}</div>
                                            </td>

                    `;
                    if (item.participateApplystate == '0') {
                        modalValueTbody += `<td class="text-center" id='${item.participateNum}'>
                                                <div class="btn-group btn-group-pill" role="group" aria-label="Basic example">
                                                    <button class="btn btn-outline-primary" type="button" onclick="volPassRecruit(${item.activityNum},${item.participateNum})">√</button>
                                                    <button class="btn btn-outline-danger" type="button" onclick="volUnPassRecruit(${item.activityNum},${item.participateNum})">×</button>
                                                </div>
                                            </td>
                                          </tr>`;
                    } else if (item.participateApplystate == '1') {
                        modalValueTbody += `<td class="text-center" style="color: #009900">已通过</td>
                                          </tr>`;
                    } else if (item.participateApplystate == '2') {
                        modalValueTbody += `<td class="text-center" style="color: red">未通过</td>
                                          </tr>`;
                    }

                });
                if (recruitVolList.length === 0) {
                    modalValueTbody = `<tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>`;
                }
                $("#volRecruitList_table tbody").html(modalValueTbody);
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function volPassRecruit(activityNum, participateNum) {
        $.ajax({
            url: "/participate/volPassRecruit",
            type: "POST",
            data: {
                "participateNum": participateNum
            },
            success: function (result) {
                console.log(result);
                if (result && result.code === 100) {
                    volRecruit(activityNum);//审核结果以接口返回为准，重新渲染招募列表
                } else {
                    alert((result && result.msg) ? result.msg : "审核操作失败");
                }
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function volUnPassRecruit(activityNum,participateNum){
        $.ajax({
            url: "/participate/volUnPassRecruit",
            type: "POST",
            data: {
                "participateNum":participateNum
            },
            success: function (result) {
                console.log(result);
                if (result && result.code === 100) {
                    volRecruit(activityNum);//审核结果以接口返回为准，重新渲染招募列表
                } else {
                    alert((result && result.msg) ? result.msg : "审核操作失败");
                }
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    //一进网页就加载freshPage()
    $(document).ready(function () {
        $.ajax({
            url: "/activity/findNotStartActivityByNumAndState",
            type: "GET",
            data: {},
            success: function (result) {
                console.log(result);
                build_activity_table(result);//画表格
            },
            error: function (result) {
                console.log(result);
            }
        });

    });

</script>
