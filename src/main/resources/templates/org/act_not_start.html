<script type="text/javascript">

    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }

    function toDateTimeInput(value) {
        if (!value) {
            return "";
        }
        return String(value).replace(" ", "T").substring(0, 16);
    }

    function toApiTime(value) {
        if (!value) {
            return "";
        }
        return String(value).replace("T", " ");
    }

    function renderPager(holderId, total, page, size, onChange) {
        total = Number(total) || 0;
        page = Number(page) || 1;
        size = Number(size) || 10;
        var totalPage = Math.ceil(total / size);
        var currentPage = totalPage === 0 ? 0 : page;
        var html = '<div class="d-flex justify-content-between align-items-center flex-wrap">'
            + '<span class="text-muted">共 ' + total + ' 条，第 ' + currentPage + ' / ' + totalPage + ' 页</span>'
            + '<div class="btn-group btn-group-pill" role="group" aria-label="分页">'
            + '<button class="btn btn-outline-primary btn-sm pager-prev" type="button"'
            + (page <= 1 ? ' disabled' : '') + '>上一页</button>'
            + '<button class="btn btn-outline-primary btn-sm pager-next" type="button"'
            + (page >= totalPage ? ' disabled' : '') + '>下一页</button>'
            + '</div></div>';
        var $holder = $("#" + holderId);
        $holder.html(html);
        $holder.find(".pager-prev").on("click", function () {
            if (page > 1) {
                onChange(page - 1);
            }
        });
        $holder.find(".pager-next").on("click", function () {
            if (page < totalPage) {
                onChange(page + 1);
            }
        });
    }

    function pageData(result, fallbackPage, fallbackSize) {
        var extend = (result && result.extend) ? result.extend : {};
        var total = Number(extend.total);
        var currentPage = Number(extend.page);
        var pageSize = Number(extend.size);
        return {
            list: extend.list || [],
            total: (isNaN(total) || total < 0) ? 0 : total,
            page: (isNaN(currentPage) || currentPage < 1) ? fallbackPage : currentPage,
            size: (isNaN(pageSize) || pageSize < 1) ? fallbackSize : pageSize
        };
    }

    function tip(result, fallback) {
        if (result && result.msg) {
            return result.msg;
        }
        if (typeof result === "string" && result) {
            return result;
        }
        return fallback;
    }

    function loadUnreadCount() {
        $.ajax({
            url: "/org/notifications/unreadCount",
            type: "GET",
            success: function (result) {
                var count = (result && result.extend) ? result.extend.count : 0;
                $("#unread_count").text((count === null || count === undefined) ? 0 : count);
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    var page = 1, size = 10, keyword = "";

    var recruitActivityNum = null;
    var recruitPage = 1;
    var recruitSize = 10;
    var recruitKeyword = "";

    var recruitModal = null;

    var activityNames = {};

    function renderActivityTable(list) {
        var tabValue = "";
        $.each(list, function (index, item) {
            activityNames[item.activityNum] = item.activityName;
            tabValue += `<tr>
                            <td class="text-center">${item.activityName}</td>
                            <td class="text-center">${formatTime(item.activityBegintime)}</td>
                            <td class="text-center">${formatTime(item.activityEndtime)}</td>
                            <td class="text-center">${item.activityLocation || "—"}</td>
                            <td class="text-center">${item.activityNeedpeople || 0}</td>
                            <td class="text-center">
                                <div class="btn-group btn-group-pill" role="group" aria-label="活动操作">
                                    <button class="btn btn-outline-secondary btn-sm" type="button"
                                            onclick="openVolRecruit(${item.activityNum})">志愿者招募</button>
                                    <button class="btn btn-outline-primary btn-sm" type="button"
                                            onclick="startActivity(${item.activityNum})">开始活动</button>
                                    <a class="btn btn-outline-success btn-sm"
                                       href="/org/export/participants?activityNum=${item.activityNum}">导出报名名单</a>
                                    <a class="btn btn-outline-info btn-sm"
                                       href="/org/export/hours?activityNum=${item.activityNum}">导出服务时长</a>
                                </div>
                            </td>
                         </tr>`;
        });
        if (list.length === 0) {
            tabValue = `<tr><td colspan="6" class="text-center text-muted">暂无数据</td></tr>`;
        }
        $("#activity_table tbody").html(tabValue);
    }

    function load() {
        $.ajax({
            url: "/activity/findNotStartActivityByNumAndState",
            type: "GET",
            data: {page: page, size: size, keyword: keyword},
            success: function (result) {
                var data = pageData(result, page, size);
                renderActivityTable(data.list);
                renderPager("activity_pager", data.total, data.page, data.size, function (target) {
                    page = target;
                    load();
                });
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function startActivity(activityNum) {
        if (!confirm("确定开始该活动吗？开始后志愿者可凭签到码现场签到。")) {
            return;
        }
        $.ajax({
            url: "/activity/startActivity",
            type: "POST",
            data: {"activityNum": activityNum},
            success: function (result) {
                var success = result && result.code === 100;
                alert(tip(result, success ? "活动已开始" : "活动开始失败"));
                if (success) {
                    load();
                }
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function openVolRecruit(activityNum) {
        recruitActivityNum = activityNum;
        recruitPage = 1;
        recruitKeyword = "";
        $("#recruit_activity_name").text("：" + (activityNames[activityNum] || ""));
        loadRecruitList();
        if (!recruitModal) {
            recruitModal = new bootstrap.Modal(document.getElementById("volRecruitModal"));
        }
        recruitModal.show();
    }

    function applyStateText(state) {
        if (state === "0") {
            return "待审核";
        }
        if (state === "1") {
            return '<span style="color: #009900">已通过</span>';
        }
        if (state === "2") {
            return '<span style="color: red">未通过</span>';
        }
        if (state === "3") {
            return "候补";
        }
        return "—";
    }

    function recruitControlHtml(item) {
        var buttons = "";
        if (item.participateApplystate === "0" || item.participateApplystate === "3") {
            buttons += `<button class="btn btn-outline-primary btn-sm" type="button"
                                onclick="volPassRecruit(${item.participateNum})">通过</button>
                        <button class="btn btn-outline-danger btn-sm" type="button"
                                onclick="volUnPassRecruit(${item.participateNum})">驳回</button>`;
        }
        if (item.participateApplystate === "0" || item.participateApplystate === "1"
            || item.participateApplystate === "3") {
            buttons += `<button class="btn btn-outline-warning btn-sm" type="button"
                                onclick="removeParticipate(${item.participateNum})">移除报名</button>`;
        }
        if (!buttons) {
            return "—";
        }
        return `<div class="btn-group btn-group-pill" role="group" aria-label="报名操作">${buttons}</div>`;
    }

    function loadRecruitList() {
        if (recruitActivityNum === null) {
            return;
        }
        $.ajax({
            url: "/activity/volRecruit",
            type: "GET",
            data: {
                "activityNum": recruitActivityNum,
                "page": recruitPage,
                "size": recruitSize,
                "keyword": recruitKeyword
            },
            success: function (result) {
                var data = pageData(result, recruitPage, recruitSize);
                var tabValue = "";
                $.each(data.list, function (index, item) {
                    var volunteer = item.volunteer || {};
                    var score = (item.matchScore === null || item.matchScore === undefined)
                        ? "—" : item.matchScore + " 分";
                    var reasons = item.matchReasons || "—";
                    var confirmText = item.participateConfirmstateText || "待确认";
                    var noshowText = (item.participateNoshow === 1)
                        ? '<span style="color: red">爽约</span>' : "正常";
                    tabValue += `<tr>
                                    <td class="text-center">${volunteer.volunteerId || "—"}</td>
                                    <td class="text-center">${volunteer.volunteerName || "—"}</td>
                                    <td class="text-center">${formatTime(item.participateApplytime)}</td>
                                    <td class="text-center">${volunteer.volunteerGender || "—"}</td>
                                    <td class="text-center">${volunteer.volunteerTel || "—"}</td>
                                    <td class="text-center">${score}
                                        <div class="text-muted small">${reasons}</div>
                                    </td>
                                    <td class="text-center">${confirmText}</td>
                                    <td class="text-center">${noshowText}</td>
                                    <td class="text-center">${applyStateText(item.participateApplystate)}</td>
                                    <td class="text-center">${recruitControlHtml(item)}</td>
                                 </tr>`;
                });
                if (data.list.length === 0) {
                    tabValue = `<tr><td colspan="10" class="text-center text-muted">暂无数据</td></tr>`;
                }
                $("#volRecruitList_table tbody").html(tabValue);
                renderPager("recruit_pager", data.total, data.page, data.size, function (target) {
                    recruitPage = target;
                    loadRecruitList();
                });
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function volPassRecruit(participateNum) {
        $.ajax({
            url: "/participate/volPassRecruit",
            type: "POST",
            data: {"participateNum": participateNum},
            success: function (result) {
                alert(tip(result, "审核操作已完成"));
                loadRecruitList();
                load();
            },
            error: function (result) {
                console.log(result);
                loadRecruitList();
            }
        });
    }

    function volUnPassRecruit(participateNum) {
        $.ajax({
            url: "/participate/volUnPassRecruit",
            type: "POST",
            data: {"participateNum": participateNum},
            success: function (result) {
                alert(tip(result, "审核操作已完成"));
                loadRecruitList();
                load();
            },
            error: function (result) {
                console.log(result);
                loadRecruitList();
            }
        });
    }

    function removeParticipate(participateNum) {
        if (!confirm("确定移除该志愿者的报名记录吗？")) {
            return;
        }
        $.ajax({
            url: "/participate/remove",
            type: "POST",
            data: {"participateNum": participateNum},
            success: function (result) {
                var success = result && result.code === 100;
                alert(tip(result, success ? "报名已移除" : "移除报名失败"));
                if (success) {
                    loadRecruitList();
                    load();
                }
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    $(document).ready(function () {
        loadUnreadCount();
        load();
        $("#search_button").click(function () {
            page = 1;
            keyword = $.trim($("#keyword").val());
            load();
        });
        $("#recruit_search_button").click(function () {
            recruitPage = 1;
            recruitKeyword = $.trim($("#recruit_keyword").val());
            loadRecruitList();
        });
    });

</script>
