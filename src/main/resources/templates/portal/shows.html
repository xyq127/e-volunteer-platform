<div id="portalModal"
     style="display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:1200;overflow-y:auto;padding:40px 15px;background:rgba(34,34,34,.6);">

<script src="/portal/js/core.min.js"></script>
<script src="/portal/js/script.js"></script>

<script type="text/javascript">

    var showPage = 1;
    var showSize = 6;
    var showKeyword = "";

    function portalEscapeHtml(value) {
        if (value === null || value === undefined) {
            return "";
        }
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function portalSummary(value, length) {
        var text = value === null || value === undefined ? "" : String(value);
        return text.length > length ? text.substring(0, length) + "…" : text;
    }

    function portalFormatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }

    function portalListOf(result) {
        return result && result.extend && result.extend.list ? result.extend.list : [];
    }

    function portalRenderPager(total, page, size) {
        var totalPage = total > 0 ? Math.ceil(total / size) : 0;
        document.getElementById("showPageInfo").textContent =
            "第 " + (totalPage > 0 ? page : 0) + " / " + totalPage + " 页，共 " + total + " 条";
        document.getElementById("showPrevPage").disabled = page <= 1;
        document.getElementById("showNextPage").disabled = totalPage === 0 || page >= totalPage;
    }

    function portalEmptyList() {
        document.getElementById("showList").innerHTML =
            '<div class="col-12"><p class="text-muted">暂无数据</p></div>';
    }

    function portalLoadShows() {
        var container = document.getElementById("showList");
        var url = "/portal/site/shows?page=" + showPage + "&size=" + showSize
            + "&keyword=" + encodeURIComponent(showKeyword);
        fetch(url).then(function (response) {
            return response.json();
        }).then(function (result) {
            var list = portalListOf(result);
            var extend = result.extend ? result.extend : {};
            portalRenderPager(Number(extend.total || 0), Number(extend.page || showPage),
                Number(extend.size || showSize));
            if (!list.length) {
                portalEmptyList();
                return;
            }
            var html = "";
            for (var i = 0; i < list.length; i++) {
                var show = list[i];
                html += '<div class="col-md-6 col-lg-4">'
                    + '<div class="card portal-show-card" data-num="'
                    + portalEscapeHtml(show.showNum) + '">';
                if (show.pictureRoute) {
                    html += '<img class="card-img-top" src="' + portalEscapeHtml(show.pictureRoute)
                        + '" alt="' + portalEscapeHtml(show.activityName || "志愿秀图片")
                        + '" style="height:200px;object-fit:cover;"/>';
                }
                html += '<div class="card-body">'
                    + '<h4 class="card-title">' + portalEscapeHtml(show.volunteerName || "匿名志愿者") + '</h4>'
                    + '<p class="text-muted">关联活动：'
                    + portalEscapeHtml(show.activityName || "未关联活动") + '</p>'
                    + '<p class="text-muted">分享时间：'
                    + portalEscapeHtml(portalFormatTime(show.showSharetime)) + '</p>'
                    + '<p class="card-text">' + portalEscapeHtml(portalSummary(show.showDetail, 60)) + '</p>'
                    + '<p class="text-muted">浏览 ' + Number(show.showBrowse || 0)
                    + ' 次 · 点赞 ' + Number(show.showLike || 0) + ' 次</p>'
                    + '<button class="btn btn-secondary portal-show-detail" type="button" data-num="'
                    + portalEscapeHtml(show.showNum) + '">查看详情</button>'
                    + '</div></div></div>';
            }
            container.innerHTML = html;
            var buttons = container.querySelectorAll(".portal-show-detail");
            for (var j = 0; j < buttons.length; j++) {
                buttons[j].addEventListener("click", function () {
                    portalShowDetail(this.getAttribute("data-num"));
                });
            }
        }).catch(function () {
            portalRenderPager(0, 1, showSize);
            portalEmptyList();
        });
    }

    function portalShowDetail(showNum) {
        fetch("/portal/site/show?showNum=" + encodeURIComponent(showNum)).then(function (response) {
            return response.json();
        }).then(function (result) {
            var show = result.extend ? result.extend.show : null;
            if (result.code !== 100 || !show) {
                alert(result.msg || "该志愿秀不存在或已被删除");
                return;
            }
            var pictures = show.pictureRoutes ? show.pictureRoutes : [];
            var pictureHtml = "";
            if (pictures.length) {
                for (var i = 0; i < pictures.length; i++) {
                    pictureHtml += '<p><img src="' + portalEscapeHtml(pictures[i])
                        + '" alt="志愿秀图片" style="max-width:100%;"/></p>';
                }
            } else {
                pictureHtml = '<p class="text-muted">该志愿秀没有上传图片</p>';
            }
            portalOpenModal(show.volunteerName || "志愿秀详情",
                '<p class="text-muted">关联活动：' + portalEscapeHtml(show.activityName || "未关联活动")
                + ' · 分享时间：' + portalEscapeHtml(portalFormatTime(show.showSharetime))
                + ' · 浏览 ' + Number(show.showBrowse || 0) + ' 次 · 点赞 '
                + Number(show.showLike || 0) + ' 次</p>'
                + '<p>' + portalEscapeHtml(show.showDetail).replace(/\n/g, "<br>") + '</p>'
                + '<h4>志愿秀图片</h4>' + pictureHtml);

            portalLoadShows();
        }).catch(function () {
            alert("志愿秀详情加载失败，请稍后重试");
        });
    }

    function portalOpenModal(title, bodyHtml) {
        document.getElementById("portalModalTitle").textContent = title || "";
        document.getElementById("portalModalBody").innerHTML = bodyHtml;
        document.getElementById("portalModal").style.display = "block";
    }

    function portalCloseModal() {
        document.getElementById("portalModal").style.display = "none";
    }

    document.getElementById("portalModalClose").addEventListener("click", portalCloseModal);
    document.getElementById("portalModal").addEventListener("click", function (event) {
        if (event.target === this) {
            portalCloseModal();
        }
    });

    document.getElementById("showSearchForm").addEventListener("submit", function (event) {
        event.preventDefault();
        showKeyword = document.getElementById("showKeyword").value.trim();
        showPage = 1;
        portalLoadShows();
    });

    document.getElementById("showPrevPage").addEventListener("click", function () {
        if (showPage > 1) {
            showPage = showPage - 1;
            portalLoadShows();
        }
    });

    document.getElementById("showNextPage").addEventListener("click", function () {
        showPage = showPage + 1;
        portalLoadShows();
    });

    portalLoadShows();
</script>
