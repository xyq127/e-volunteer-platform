<script type="text/javascript">
    /**
     * 将后端返回的时间格式化为 yyyy-MM-dd HH:mm
     */
    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }

    /**
     * 志愿秀分页条件
     */
    var showPage = 1;
    var showSize = 10;
    var showTotal = 0;

    /**
     * 查询当前登录志愿者资料，并刷新侧边栏身份信息
     */
    function loadProfile() {
        $.ajax({
            url: "/volunteer/profile",
            type: "GET",
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend || !result.extend.profile) {
                    if (result && result.msg) {
                        alert(result.msg);
                    }
                    return;
                }
                var profile = result.extend.profile;
                $("#sidebar_volunteer_name").text(profile.volunteerName || "志愿者");
                $("#sidebar_volunteer_id").text("编号：" + (profile.volunteerId || "—"));
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    /**
     * 加载可关联的活动下拉项：仅本人已通过报名的活动
     */
    function loadActivityOptions() {
        $.ajax({
            url: "/volunteer/myParticipations",
            type: "GET",
            data: {page: 1, size: 100},
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend) {
                    if (result && result.msg) {
                        alert(result.msg);
                    }
                    return;
                }
                var $select = $("#show_activity");
                $select.empty();
                $select.append($("<option></option>").val("").text("不关联活动"));
                $.each(result.extend.list || [], function (index, item) {
                    if (String(item.participateApplystate) !== "1") {
                        return;
                    }
                    $select.append($("<option></option>").val(item.activityNum).text(item.activityName));
                });
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    /**
     * 渲染本人志愿秀列表
     */
    function renderShows(shows) {
        var html = "";
        if (!shows || shows.length === 0) {
            html = '<tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>';
        } else {
            $.each(shows, function (index, item) {
                var pictureCount = (item.pictureCount === null || item.pictureCount === undefined)
                    ? "—" : item.pictureCount + " 张";
                var browseCount = Number(item.showBrowse);
                if (isNaN(browseCount) || browseCount < 0) {
                    browseCount = 0;
                }
                var likeCount = Number(item.showLike);
                if (isNaN(likeCount) || likeCount < 0) {
                    likeCount = 0;
                }
                html += "<tr>"
                    + "<td>" + (item.showDetail || "—") + "</td>"
                    + "<td>" + formatTime(item.showSharetime) + "</td>"
                    + "<td>" + pictureCount + "</td>"
                    + "<td>" + browseCount + " 次</td>"
                    + "<td>" + likeCount + " 次</td>"
                    + "</tr>";
            });
        }
        $("#show_table").html(html);
    }

    /**
     * 渲染分页控件：条数、页码信息与上一页/下一页可用状态
     */
    function renderPager(total, current, pageSize) {
        showTotal = Number(total);
        if (isNaN(showTotal) || showTotal < 0) {
            showTotal = 0;
        }
        var currentPage = Number(current);
        if (isNaN(currentPage) || currentPage < 1) {
            currentPage = 1;
        }
        var currentSize = Number(pageSize);
        if (isNaN(currentSize) || currentSize < 1) {
            currentSize = showSize;
        }
        var totalPages = showTotal > 0 ? Math.ceil(showTotal / currentSize) : 1;
        $("#show_total").text("共 " + showTotal + " 条");
        $("#show_page_info").text("第 " + currentPage + " / " + totalPages + " 页");
        $("#show_prev").toggleClass("disabled", currentPage <= 1);
        $("#show_next").toggleClass("disabled", showTotal === 0 || currentPage >= totalPages);
    }

    /**
     * 加载本人发布的志愿秀
     */
    function loadShows() {
        $.ajax({
            url: "/volunteer/content/shows",
            type: "GET",
            data: {page: showPage, size: showSize},
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend) {
                    if (result && result.msg) {
                        alert(result.msg);
                    }
                    return;
                }
                renderShows(result.extend.list);
                renderPager(result.extend.total, result.extend.page, result.extend.size);
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    /**
     * 志愿秀翻页：step 为 1 下一页、-1 上一页
     */
    function changeShowPage(step) {
        var nextPage = showPage + step;
        var totalPages = showTotal > 0 ? Math.ceil(showTotal / showSize) : 1;
        if (nextPage < 1 || nextPage > totalPages) {
            return;
        }
        showPage = nextPage;
        loadShows();
    }

    /**
     * 清空发布表单
     */
    function resetShowForm() {
        $("#show_detail").val("");
        $("#show_activity").val("");
        $("#show_pictures").val("");
    }

    /**
     * 发布志愿秀：先创建志愿秀拿到编号，再逐张上传现场图片
     */
    function publishShow() {
        var detail = $.trim($("#show_detail").val());
        if (!detail) {
            alert("请输入分享内容");
            return;
        }
        var activityNum = $("#show_activity").val();
        var fileInput = document.getElementById("show_pictures");
        var files = (fileInput && fileInput.files) ? fileInput.files : [];
        $("#btn_publish_show").prop("disabled", true);
        $.ajax({
            url: "/volunteer/content/show/publish",
            type: "POST",
            data: {detail: detail, activityNum: activityNum},
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend || !result.extend.showNum) {
                    $("#btn_publish_show").prop("disabled", false);
                    alert((result && result.msg) ? result.msg : "志愿秀发布失败，请稍后重试");
                    return;
                }
                var msg = result.msg ? result.msg : "志愿秀发布成功";
                if (files.length === 0) {
                    finishPublish(msg);
                    return;
                }
                uploadPicture(result.extend.showNum, files, 0, msg);
            },
            error: function (result) {
                console.log(result);
                $("#btn_publish_show").prop("disabled", false);
                alert("网络异常，请稍后重试");
            }
        });
    }

    /**
     * 逐张上传志愿秀图片，全部处理完成后统一提示并刷新列表
     */
    function uploadPicture(showNum, files, index, publishMsg) {
        if (index >= files.length) {
            finishPublish(publishMsg);
            return;
        }
        var formData = new FormData();
        formData.append("showNum", showNum);
        formData.append("file", files[index]);
        $.ajax({
            url: "/volunteer/content/show/picture",
            type: "POST",
            data: formData,
            processData: false,
            contentType: false,
            success: function (result) {
                if (!result || result.code !== 100) {
                    var failMsg = (result && result.msg) ? result.msg : "图片上传失败，请稍后重试";
                    finishPublish(publishMsg + "；" + failMsg);
                    return;
                }
                uploadPicture(showNum, files, index + 1, result.msg ? result.msg : publishMsg);
            },
            error: function (result) {
                console.log(result);
                finishPublish(publishMsg + "；图片上传失败，请稍后重试");
            }
        });
    }

    /**
     * 结束发布流程：恢复按钮、提示结果并刷新本人志愿秀列表
     */
    function finishPublish(msg) {
        $("#btn_publish_show").prop("disabled", false);
        alert(msg);
        resetShowForm();
        showPage = 1;
        loadShows();
    }

    $(document).ready(function () {
        loadProfile();
        loadActivityOptions();
        loadShows();
    });
</script>
