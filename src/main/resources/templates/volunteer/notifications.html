<script type="text/javascript">

    function formatTime(value) {
        if (!value) {
            return "—";
        }
        return String(value).replace("T", " ").substring(0, 16);
    }

    var notifPage = 1;
    var notifSize = 10;
    var notifTotal = 0;

    function isUnread(item) {
        return String(item.notificationRead) !== "1";
    }

    function loadProfile() {
        $.ajax({
            url: "/volunteer/profile",
            type: "GET",
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend || !result.extend.profile) {
                    if (result && result.msg) {
                        alert(result.msg);
                    }
                    return;
                }
                var profile = result.extend.profile;
                $("#sidebar_volunteer_name").text(profile.volunteerName || "志愿者");
                $("#sidebar_volunteer_id").text("编号：" + (profile.volunteerId || "—"));
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function renderNotifications(notifications) {
        var html = "";
        if (!notifications || notifications.length === 0) {
            html = '<tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>';
        } else {
            $.each(notifications, function (index, item) {
                var unread = isUnread(item);
                html += "<tr" + (unread ? ' class="table-primary"' : "") + ">"
                    + "<td>" + (item.notificationTitle || "—") + "</td>"
                    + "<td>" + (item.notificationDetail || "—") + "</td>"
                    + "<td>" + formatTime(item.notificationTime) + "</td>"
                    + "<td>" + (unread
                        ? '<span class="badge badge-danger">未读</span>'
                        : '<span class="badge badge-secondary">已读</span>') + "</td>"
                    + "<td>" + (unread
                        ? '<button class="btn btn-primary btn-xs" type="button" onclick="markRead('
                            + item.notificationNum + ')">标记已读</button>'
                        : '<span class="text-muted">—</span>') + "</td>"
                    + "</tr>";
            });
        }
        $("#notification_table").html(html);
    }

    function renderPager(total, current, pageSize) {
        notifTotal = Number(total);
        if (isNaN(notifTotal) || notifTotal < 0) {
            notifTotal = 0;
        }
        var currentPage = Number(current);
        if (isNaN(currentPage) || currentPage < 1) {
            currentPage = 1;
        }
        var currentSize = Number(pageSize);
        if (isNaN(currentSize) || currentSize < 1) {
            currentSize = notifSize;
        }
        var totalPages = notifTotal > 0 ? Math.ceil(notifTotal / currentSize) : 1;
        $("#notif_total").text("共 " + notifTotal + " 条");
        $("#notif_page_info").text("第 " + currentPage + " / " + totalPages + " 页");
        $("#notif_prev").toggleClass("disabled", currentPage <= 1);
        $("#notif_next").toggleClass("disabled", notifTotal === 0 || currentPage >= totalPages);
    }

    function loadNotifications() {
        $.ajax({
            url: "/volunteer/notifications",
            type: "GET",
            data: {page: notifPage, size: notifSize},
            success: function (result) {
                if (!result || result.code !== 100 || !result.extend) {
                    if (result && result.msg) {
                        alert(result.msg);
                    }
                    return;
                }
                renderNotifications(result.extend.list);
                renderPager(result.extend.total, result.extend.page, result.extend.size);
            },
            error: function (result) {
                console.log(result);
            }
        });
    }

    function changeNotifPage(step) {
        var nextPage = notifPage + step;
        var totalPages = notifTotal > 0 ? Math.ceil(notifTotal / notifSize) : 1;
        if (nextPage < 1 || nextPage > totalPages) {
            return;
        }
        notifPage = nextPage;
        loadNotifications();
    }

    function markRead(notificationNum) {
        $.ajax({
            url: "/volunteer/notifications/read",
            type: "POST",
            data: {notificationNum: notificationNum},
            success: function (result) {
                alert((result && result.msg) ? result.msg : "操作完成");
                if (result && result.code === 100) {
                    loadNotifications();
                }
            },
            error: function (result) {
                console.log(result);
                alert("网络异常，请稍后重试");
            }
        });
    }

    function markAllRead() {
        $.ajax({
            url: "/volunteer/notifications/readAll",
            type: "POST",
            success: function (result) {
                alert((result && result.msg) ? result.msg : "操作完成");
                if (result && result.code === 100) {
                    notifPage = 1;
                    loadNotifications();
                }
            },
            error: function (result) {
                console.log(result);
                alert("网络异常，请稍后重试");
            }
        });
    }

    $(document).ready(function () {
        loadProfile();
        loadNotifications();
    });
</script>
