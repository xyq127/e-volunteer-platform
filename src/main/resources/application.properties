spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${EVOLUNTEER_DB_URL:jdbc:mysql://localhost:3306/e_volunteer_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${EVOLUNTEER_DB_USERNAME:root}
spring.datasource.password=${EVOLUNTEER_DB_PASSWORD:801}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

mybatis-plus.global-config.db-config.id-type=auto

mybatis-plus.type-aliases-package=com.evolunteer.entity

mybatis-plus.type-enums-package=com.evolunteer.enums

spring.web.resources.static-locations=classpath:/static/,classpath:/templates/,classpath:/templates/portal/

spring.jackson.time-zone=Asia/Shanghai

evolunteer.certificate.secret=${EVOLUNTEER_CERT_SECRET:evolunteer-certificate-secret-2026}

server.port=8111

logging.level.com.evolunteer=info

evolunteer.upload.dir=${EVOLUNTEER_UPLOAD_DIR:upload}

evolunteer.schedule.interval-ms=${EVOLUNTEER_SCHEDULE_INTERVAL_MS:60000}
